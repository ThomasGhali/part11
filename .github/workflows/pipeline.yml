name: Deployment pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check style
        run: npm run eslint

      - run: npm test

      - run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Trigger deployment
        if: github.event_name == 'push'
        run: curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    runs-on: ubuntu-latest
    needs: [simple_deployment_pipeline]
    env:
      COMMIT_MESSAGES: ${{toJson(github.event.commits.*.message)}}
    if: >-
      github.event_name == 'push' &&
      !contains(toJson(github.event.commits.*.message), '#skip')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Bump git tag version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch
          DRY_RUN: false

  discord_notification:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    needs: simple_deployment_pipeline
    steps:
      - name: Notify Discord on success
        if: needs.simple_deployment_pipeline.result == 'success'
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: 'Deployment successful'
          content: '✅ **Deployment Successful!** A new version deployed to production'
          description: |
            **Repository:** ${{github.event.repository.full_name}}
            **Branch:** ${{github.ref_name}}
            **Commit:** ${{github.event.head_commit.id}}
            **Message:** ${{github.event.head_commit.message}}
            **Author:** ${{github.event.head_commit.author.name}}
            **Workflow:** ${{github.workflow}}
            **Job:** ${{github.job}}

      - name: Notify Discord on failure
        if: needs.simple_deployment_pipeline.result == 'failure'
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: 'Deployment failed'
          content: '❌ **Build Failed!** The pipeline encountered an error'
          description: |
            **Commit:** ${{github.event.head_commit.id}}
            **Message:** ${{github.event.head_commit.message}}
            **Author:** ${{github.event.head_commit.author.name}}
